server:
  port: 8080

spring:
  application:
    name: safescan

  datasource:
    url: jdbc:mysql://localhost:8889/safescan
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379

safescan:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}

  scanner:
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: 3310
    tmp-dir: ${java.io.tmpdir}/safescan
    max-file-size-mb: 20

  plans:
    free-scan-limit: 10

logging:
  level:
    com.backend.backend: INFO
    org.springframework.web: INFO