services:
  mysql:
    image: mysql:8.4
    container_name: safescan-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: safescan
      MYSQL_USER: safescan
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "8889:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: safescan-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    container_name: safescan-clamav
    restart: unless-stopped

    ports:
      - "3310:3310"

    volumes:
      - clamav_data:/var/lib/clamav

    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  mysql_data:
  clamav_data:
